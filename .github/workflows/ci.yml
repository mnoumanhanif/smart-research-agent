name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install langchain langchain-groq langchain-community langgraph
          pip install pandas numpy scipy

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings as informational (non-blocking)
          flake8 src/ --count --max-line-length=120 --statistics --exit-zero

      - name: Run tests
        run: |
          pytest tests/ -v
